# ============================================================================
# Apache Virtual Host Configuration for MXA OCR
# ============================================================================
# Product: MXA OCR
# Hostname: ocr.gismartanalytics.com
# Document Root: /var/www/mxa-ocr-app/current/php-app/public
#
# Installation:
# 1. Copy this file to /etc/apache2/sites-available/mxa-ocr.conf
# 2. Enable the site: sudo a2ensite mxa-ocr
# 3. Enable required modules: sudo a2enmod rewrite ssl headers proxy proxy_http
# 4. Reload Apache: sudo systemctl reload apache2
# ============================================================================

<VirtualHost *:80>
    ServerName ocr.gismartanalytics.com
    ServerAdmin admin@gismartanalytics.com
    
    # Redirect all HTTP traffic to HTTPS
    Redirect permanent / https://ocr.gismartanalytics.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName ocr.gismartanalytics.com
    ServerAdmin admin@gismartanalytics.com
    
    # Document root points to PHP public directory
    DocumentRoot /var/www/mxa-ocr-app/current/php-app/public
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/ocr.gismartanalytics.com.crt
    SSLCertificateKeyFile /etc/ssl/private/ocr.gismartanalytics.com.key
    SSLCertificateChainFile /etc/ssl/certs/ca-bundle.crt
    
    # Security Headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # Directory Configuration
    <Directory /var/www/mxa-ocr-app/current/php-app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Enable rewrite engine
        RewriteEngine On
        
        # Redirect to index.php if file doesn't exist
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>
    
    # Deny access to sensitive files
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    
    <FilesMatch "\.(env|sql|md|log)$">
        Require all denied
    </FilesMatch>
    
    # PHP Configuration
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.1-fpm.sock|fcgi://localhost"
    </FilesMatch>
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/mxa-ocr-error.log
    CustomLog ${APACHE_LOG_DIR}/mxa-ocr-access.log combined
    LogLevel warn
    
    # Proxy to Python Backend (optional - if direct access needed)
    # ProxyPreserveHost On
    # ProxyPass /api http://192.168.1.90:8100/api
    # ProxyPassReverse /api http://192.168.1.90:8100/api
</VirtualHost>

# ============================================================================
# SSL Best Practices
# ============================================================================
# Uncomment and configure if needed:
#
# SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
# SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
# SSLHonorCipherOrder on
# SSLCompression off
# SSLSessionTickets off
# ============================================================================
