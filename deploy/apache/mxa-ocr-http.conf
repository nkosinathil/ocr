# ============================================================================
# Apache Virtual Host Configuration for MXA OCR (HTTP-only fallback)
# ============================================================================
# Product: MXA OCR
# Environment: Internal / No SSL Certificates Available
# Document Root: /var/www/mxa-ocr-app/current/php-app/public
# ============================================================================

<VirtualHost *:80>
    ServerName ocr.gismartanalytics.com
    ServerAdmin admin@gismartanalytics.com

    # Document root points to PHP public directory
    DocumentRoot /var/www/mxa-ocr-app/current/php-app/public

    # Security Headers (HSTS intentionally omitted for HTTP-only fallback)
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Directory Configuration
    <Directory /var/www/mxa-ocr-app/current/php-app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Enable rewrite engine
        RewriteEngine On

        # Redirect to index.php if file doesn't exist
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>

    # Deny access to sensitive files
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <FilesMatch "\.(env|sql|md|log)$">
        Require all denied
    </FilesMatch>

    # PHP Configuration
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.1-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/mxa-ocr-error.log
    CustomLog ${APACHE_LOG_DIR}/mxa-ocr-access.log combined
    LogLevel warn
</VirtualHost>
