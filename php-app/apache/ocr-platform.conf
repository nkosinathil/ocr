<VirtualHost *:80>
    ServerName 192.168.1.66
    DocumentRoot /var/www/ocr-platform/public

    <Directory /var/www/ocr-platform/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Upload size limits
    LimitRequestBody 104857600

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/ocr-platform-error.log
    CustomLog ${APACHE_LOG_DIR}/ocr-platform-access.log combined

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>
